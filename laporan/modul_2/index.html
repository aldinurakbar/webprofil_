<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 1 - Laporan Praktikum</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #F5F3FF;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border: 2px solid #9B83FB;
            border-radius: 10px;
        }

        header {
            background-color: #312E81;
            color: white;
            text-align: center;
            padding: 25px;
            border-radius: 8px;
        }

        h2 {
            color: #312E81;
            border-bottom: 2px solid #DDD6FE;
            padding-bottom: 10px;
        }

        .daftar a {
            display: block;
            background-color: #F5F3FF;
            color: #334155;
            padding: 15px;
            margin: 10px 0;
            text-decoration: none;
            border-left: 4px solid #6366F1;
            border-radius: 5px;
            transition: 0.3s;
        }

        .daftar a:hover {
            background-color: #DDD6FE;
            padding-left: 22px;
        }

        .kembali {
            display: inline-block;
            margin-top: 15px;
            background-color: #312E81;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            background-color: #312E81;
            color: white;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>MODUL 2</h1>
            <p>LAPORAN PRAKTIKUM WEB DESAIN</p>
        </header>

        <main>

            </div>

            <a href="../../index.html" class="kembali">

            </a>

        </main>

    </div>

</body>
</html>
