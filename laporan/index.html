<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Laporan Praktikum / Tugas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
        }
        .module-list {
            list-style: none;
        }
        .module-item {
            margin-bottom: 15px;
        }
        .module-link {
            display: block;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }
        .module-link:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Halaman Laporan</h1>
        <p>Silakan pilih modul laporan di bawah ini untuk melihat detailnya:</p>
        
        <ul class="module-list">
            <li class="module-item">
                <a href="modul_1/index.html" class="module-link">📁 Modul 1</a>
            </li>
            <li class="module-item">
                <a href="modul_2/index.html" class="module-link">📁 Modul 2</a>
            </li>
            <li class="module-item">
                <a href="modul_3/index.html" class="module-link">📁 Modul 3</a>
            </li>
        </ul>

        <a href="../index.html" class="back-link">&larr; Kembali ke Profil Keluarga (Beranda Utama)</a>
    </div>

</body>
</html>
